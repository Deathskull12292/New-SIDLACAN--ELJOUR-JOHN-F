<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="script.js"></script>
</head>

<body>

<div class="container">
        <h1>Welcome</h1>
        <form id="Buy-Products">

<br>
            <label for="qnty">Quantity:</label>
            <input type="number" placeholder="Enter Quantity" id="qnty" required>

            <button type="button" onclick="document.location='payment.html'" id="nextBtn">Next Page</button>

        </form>
    
    </div> 
<script>
document.getElementById("nextBtn")
    .addEventListener("click", function() {
    let quantity = document.getElementById("qnty").value;
    localStorage.setItem("qnty", quantity); 
    window.location.href = "payment.html"; 
    });

document.addEventListener("DOMContentLoaded", function() {
    let quantity = localStorage.getItem("qnty");
    document.getElementById("quantity").textContent = "Quantity: " + quantity;
});
</script>

</body>



</html>
