<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout System</title>
    <script src="script.js" defer></script>
</head>
<body>


<div class="container">
        <h1>Checkout System</h1>
        <form id="checkout-form">
            <label for="name">Name:</label>
            <input type="text" placeholder="Enter your name" id="name" required>
            <label for="price">Price ($):</label>
            <input type="number" placeholder="Enter price" id="price" required>
            <label for="quantity">Quantity:</label>
            <input type="number" placeholder="Enter quantity" id="quantity" required>
            <label for="membership">Membership:</label>
            <select id="membership">
                <option id="regular" value="regular">Regular</option>
                <option id="premium" value="premium">Premium</option>
            </select>
            <button type="button" id="calculate-total">Calculate Total</button>

        </form>
        <div id="cart">
            <h2>Shopping Cart</h2>
            <ul id="item-list"></ul>
            <p>Total: $<span id="total">0.00</span></p>
        </div>
    </div> 







</body>


</html>
