<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bmi Calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
</head>
<body>



    <div class="container">
        <h1>BMI Calculator</h1>
        <form id="bmi-form">
            <label for="weight">Weight (kg):</label>
            <input type="number" placeholder="Enter weight" id="weight" required>
            <label for="height">Height (cm):</label>
            <input type="number" placeholder="Enter height" id="height" required>
            <button type="button" id="calculate">Calculate BMI</button>
            <p id="bmi-result" >Your bmi is:</p>
        </form>
        
    </div> 
 
</body>
</html>
